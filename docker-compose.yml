services:
  postgres:
    image: postgres:16
    container_name: pharos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pharos
      POSTGRES_PASSWORD: pharos_dev_password
      POSTGRES_DB: pharos_db
    ports:
      - "5432:5432"
    volumes:
      - pharos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharos -d pharos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pharos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pharos_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pharos_pg_data:
    external: true
  pharos_redis_data:                                                                                                                                                                                                    